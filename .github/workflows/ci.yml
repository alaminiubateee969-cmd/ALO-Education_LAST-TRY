name: CI

# Verified-PR gate: every pull request into main must pass this workflow.
# The stack is Node 22 + npm (package-lock.json is the canonical lockfile —
# verified VPS uses npm 10.9.9; Bun is not used in CI or production).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma and generate client
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"
        run: |
          npx prisma validate
          npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (incl. Sharp lazy-load regression)
        run: |
          node --test tests/image-processing.test.mjs
          bash scripts/test-deploy-rollback.sh

      - name: Production build
        env:
          DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/ci"
        run: npm run build
