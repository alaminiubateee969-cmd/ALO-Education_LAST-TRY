name: CI

# Verified-PR gate: every pull request into main must pass this workflow.
# The stack is Node 22 + npm (package-lock.json is the canonical lockfile —
# verified VPS uses npm 10.9.9; Bun is not used in CI or production).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema and generate client
        env:
          DATABASE_URL: mysql://user:placeholder@127.0.0.1:3306/db_learn
        run: |
          npx prisma validate
          npx prisma generate

      - name: Build (Next.js standalone)
        env:
          DATABASE_URL: mysql://user:placeholder@127.0.0.1:3306/db_learn
        run: |
          npm run build
          test -f .next/standalone/server.js
