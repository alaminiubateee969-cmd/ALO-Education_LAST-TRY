name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Verify committed npm lockfile
        run: |
          test -s package-lock.json || { echo "Missing package-lock.json; generate with npm 10 and commit it on this branch."; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client
        env:
          DATABASE_URL: mysql://user:placeholder@127.0.0.1:3306/db_learn
        run: |
          npx --no-install prisma validate
          npx --no-install prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          DATABASE_URL: mysql://user:placeholder@127.0.0.1:3306/db_learn
        run: npm run build
