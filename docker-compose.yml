# ALO Learning Journey — Docker Compose stack.
# The app is strictly local-first: the only optional AI service is a private
# Ollama container on an internal network (never published to the internet).
# Production deployments can also use the bare-metal PM2 + Nginx path in
# scripts/ (this compose file is the containerised alternative).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: alo-learning-journey:latest
    container_name: learn-aloeducation
    restart: unless-stopped
    ports:
      - "127.0.0.1:3017:3017"   # publish on loopback only; put Nginx/Caddy in front
    environment:
      NODE_ENV: production
      PORT: 3017
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://127.0.0.1:3017}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_OTP_PHONE: ${ADMIN_OTP_PHONE:-}
      ADMIN_OTP_REQUIRED: ${ADMIN_OTP_REQUIRED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      COMFYUI_CHECKPOINT: ${COMFYUI_CHECKPOINT:-}
      UPLOAD_DIR: /app/storage/uploads
      VIDEO_DIR: /app/storage/videos
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
    volumes:
      - ./storage:/app/storage
    networks:
      - alo-internal
    depends_on:
      ollama:
        condition: service_started

  # Private local LLM — reachable only on the compose-internal network.
  # The application's endpoint guard rejects public AI hosts by design.
  ollama:
    image: ollama/ollama:latest
    container_name: alo-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - alo-internal
    # No ports published: app reaches it as http://ollama:11434 internally.

networks:
  alo-internal:
    driver: bridge

volumes:
  ollama-models:
