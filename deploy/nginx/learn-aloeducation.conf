# learn-aloeducation — Nginx reverse proxy (verified VPS: Nginx on 80/443,
# Next.js standalone on 127.0.0.1:3017). This file is the reference copy;
# the live file belongs in /etc/nginx/sites-available/ on the VPS and is
# NOT overwritten by deploys. Install/refresh manually:
#   sudo cp deploy/nginx/learn-aloeducation.conf /etc/nginx/sites-available/learn-aloeducation
#   sudo ln -sfn /etc/nginx/sites-available/learn-aloeducation /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS certificates are managed on the VPS (e.g. certbot --nginx -d learn.aloeducation.com);
# adjust ssl_certificate paths if your issuer differs.

server {
    listen 80;
    listen [::]:80;
    server_name learn.aloeducation.com;

    # ACME challenge (certbot webroot, if used) stays on HTTP.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learn.aloeducation.com;

    ssl_certificate     /etc/letsencrypt/live/learn.aloeducation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.aloeducation.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Family-studio / media uploads can exceed the 1 MB Nginx default.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
